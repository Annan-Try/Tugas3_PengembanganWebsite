<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Halaman Pendaftaran</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header class="site-header">
      <h1>Formulir Pendaftaran Peserta</h1>
      <p>Silakan lengkapi data di bawah ini untuk mendaftar.</p>

      <nav class="site-nav">
        <ul>
          <li><a href="pendaftaran.html">Halaman Pendaftaran</a></li>
          <li><a href="detail.html">Detail Informasi Pendaftar</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="box">
        <h2>Data Pendaftar</h2>

        <!-- Form menggunakan method GET sehingga data akan dikirim melalui query string pada URL -->
        <form action="detail.html" method="GET">
          <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="contoh@gmail.com" required>
          </div>

          <div class="form-group">
            <label for="no_hp">Nomor HP</label>
            <input type="tel" id="no_hp" name="no_hp" placeholder="08xxxxxxxxxx" required>
          </div>

          <div class="form-group">
            <label for="jurusan">Pilih Jurusan</label>
            <select id="jurusan" name="jurusan" required>
              <option value="" disabled selected>-- Pilih Jurusan --</option>
              <optgroup label="Fakultas Sains">
                <option value="fisika">Fisika</option>
                <option value="biologi">Biologi</option>
                <option value="matematika">Matematika</option>
                <option value="kimia">Kimia</option>
                <option value="farmasi">Farmasi</option>
                <option value="sains_data">Sains Data</option>
              </optgroup>
              <optgroup label="Fakultas Teknologi Industri">
                <option value="informatika">Teknik Informatika</option>
                <option value="elektro">Teknik Elektro</option>
                <option value="mesin">Teknik Mesin</option>
                <option value="industri">Teknik Industri</option>
                <option value="kimia_teknik">Teknik Kimia</option>
                <option value="sistem_energi">Teknik Sistem Energi</option>
                <option value="pertambangan">Teknik Pertambangan</option>
                <option value="geologi">Teknik Geologi</option>
              </optgroup>
              <optgroup label="Fakultas Teknologi Infrastruktur dan Kewilayahan">
                <option value="sipil">Teknik Sipil</option>
                <option value="arsitektur">Arsitektur</option>
                <option value="lingkungan">Teknik Lingkungan</option>
                <option value="geomatika">Teknik Geomatika</option>
                <option value="pwk">Perencanaan Wilayah dan Kota</option>
              </optgroup>
            </select>
          </div>

          <div class="form-group">
            <label for="jenis_kelamin">Jenis Kelamin</label>
            <div class="radio-group">
              <label><input type="radio" name="jenis_kelamin" value="L" required> Laki-laki</label>
              <label><input type="radio" name="jenis_kelamin" value="P"> Perempuan</label>
            </div>
          </div>

          <div class="form-group">
            <label for="alamat">Alamat</label>
            <textarea id="alamat" name="alamat" rows="3" placeholder="Masukkan alamat lengkap"></textarea>
          </div>

          <button type="submit" class="btn-submit">Daftar Sekarang</button>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Panitia Pendaftaran. All rights reserved.</p>
    </footer>
  </div>

</body>
</html>
